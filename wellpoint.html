<title>Wellpoint</title>
<meta name="description" content="Wellpoint — patient-centered continuous care platform prototype">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout concept: patient app is a calm single mobile column with a floating tab bar;
   the clinic workspace is a desktop sidebar + content grid. Soft cool whites, deep navy ink,
   one muted blue accent; semantic green / amber / red reserved for state. */
:root {
  --bg: #F4F6F9;
  --bg-2: #EBEFF4;
  --surface: #FFFFFF;
  --surface-2: #F1F4F8;
  --ink: #101A2C;
  --ink-2: #47526A;
  --ink-3: #7A8499;
  --line: #E1E6EE;
  --accent: #3C619B;
  --accent-ink: #FFFFFF;
  --accent-soft: #E5ECF7;
  --good: #3B8466;
  --good-soft: #E3F1EA;
  --warn: #A96F14;
  --warn-soft: #FBF0DC;
  --bad: #B3413A;
  --bad-soft: #F9E3E0;
  --shadow: 0 1px 1px rgba(16, 26, 44, .03), 0 12px 32px -20px rgba(16, 26, 44, .18);
  --shadow-lift: 0 2px 4px rgba(16, 26, 44, .06), 0 18px 40px -16px rgba(16, 26, 44, .28);
  --scrim: rgba(12, 18, 30, .42);
  --font-display: "Instrument Serif", "El Messiri", "Noto Serif SC", Georgia, serif;
  --font-body: "Plus Jakarta Sans", "Readex Pro", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 26px;
  --fs-xs: .75rem;
  --fs-sm: .8125rem;
  --fs-md: .9375rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.5rem;
  --fs-2xl: 2rem;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1018; --bg-2: #0F1520; --surface: #131A26; --surface-2: #1A2332;
    --ink: #E7ECF4; --ink-2: #A8B2C4; --ink-3: #737E93; --line: #232D3E;
    --accent: #86A7DB; --accent-ink: #0B1018; --accent-soft: #1B2940;
    --good: #6CBB96; --good-soft: #13281F; --warn: #E3AA52; --warn-soft: #2C2213;
    --bad: #E57E73; --bad-soft: #321819;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.4), 0 18px 40px -16px rgba(0,0,0,.75);
    --scrim: rgba(3, 6, 12, .66);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1018; --bg-2: #0F1520; --surface: #131A26; --surface-2: #1A2332;
  --ink: #E7ECF4; --ink-2: #A8B2C4; --ink-3: #737E93; --line: #232D3E;
  --accent: #86A7DB; --accent-ink: #0B1018; --accent-soft: #1B2940;
  --good: #6CBB96; --good-soft: #13281F; --warn: #E3AA52; --warn-soft: #2C2213;
  --bad: #E57E73; --bad-soft: #321819;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift: 0 2px 4px rgba(0,0,0,.4), 0 18px 40px -16px rgba(0,0,0,.75);
  --scrim: rgba(3, 6, 12, .66);
  color-scheme: dark;
}
:root[data-size="large"] { font-size: 112.5%; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: var(--fs-md); line-height: 1.5;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}

button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; letter-spacing: -.005em; text-wrap: balance; }
h3, h4 { font-family: var(--font-body); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
:lang(ar) h1, :lang(ar) h2 { font-weight: 600; letter-spacing: 0; line-height: 1.35; }

h3 { font-size: var(--fs-lg); line-height: 1.3; font-weight: 650; }

p { margin: 0; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-data); font-size: .92em; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: var(--fs-sm); }
.xs { font-size: var(--fs-xs); }
.eyebrow { font-size: var(--fs-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 650; }
[dir="rtl"] .eyebrow { letter-spacing: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 24px; }
.stack-sm { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; }

.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.center { text-align: center; }
.hide { display: none !important; }
.flip { display: inline-flex; }
[dir="rtl"] .flip svg { transform: scaleX(-1); }
.ico { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ico-sm { width: 16px; height: 16px; }
.ico-lg { width: 26px; height: 26px; }

/* ---------- Motion ---------- */
@keyframes rise { from { opacity: .4; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheet { from { transform: translateY(100%); } to { transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
@keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 100% { box-shadow: 0 0 0 18px transparent; } }
@keyframes shimmer { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
.entering .page > * { animation: rise .75s var(--ease) both; }
.entering .page > *:nth-child(2) { animation-delay: .05s; } .entering .page > *:nth-child(3) { animation-delay: .1s; }
.entering .page > *:nth-child(4) { animation-delay: .15s; } .entering .page > *:nth-child(5) { animation-delay: .2s; }
.entering .page > *:nth-child(6) { animation-delay: .25s; } .entering .page > *:nth-child(n+7) { animation-delay: .3s; }
.reveal-armed { opacity: 0; transform: translate3d(0, 22px, 0); transition: opacity .8s var(--ease), transform .95s var(--ease); }
.reveal-armed.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; transition-duration: .001ms !important; }
  .reveal-armed { transform: none; }
}

/* ---------- Shell ---------- */
#app { min-height: 100%; }
.patient-shell { max-width: 520px; margin: 0 auto; min-height: 100%; position: relative; padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; padding: 14px 0; transition: box-shadow .4s var(--ease); background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); }
.brand { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 750; font-size: 1.05rem; letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
.brand svg { width: 26px; height: 26px; }
.icon-btn { position: relative; display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: transform .15s var(--ease), background .2s; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:active { transform: scale(.94); }
.dot-badge { position: absolute; top: 6px; inset-inline-end: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--surface); }
.tabbar { position: fixed; z-index: 30; bottom: 0; left: 0; right: 0; padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; }
.tabbar nav { pointer-events: auto; width: 100%; max-width: 440px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px; border-radius: 22px; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5); border: 1px solid var(--line); box-shadow: var(--shadow-lift); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px 7px; border: 0; background: transparent; border-radius: 16px; color: var(--ink-3); font-size: 11px; font-weight: 600; transition: color .2s, background .25s var(--ease); min-width: 0; }
.tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab.active { color: var(--accent); background: var(--accent-soft); }
.tab:active { transform: scale(.95); }

/* ---------- Surfaces ---------- */
.card { background: var(--surface); border: 1px solid color-mix(in srgb, var(--line) 70%, transparent); border-radius: var(--r-lg); padding: 22px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.card.tint { background: var(--surface-2); box-shadow: none; }
.card.tap { transition: transform .2s var(--ease), box-shadow .25s var(--ease), border-color .2s; cursor: pointer; text-align: start; width: 100%; color: inherit; }
.card.tap:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
.card.tap:active { transform: translateY(0) scale(.99); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 8px; }
.list { display: flex; flex-direction: column; }
.list > .li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.list > .li:last-child { border-bottom: 0; }
.divider { height: 1px; background: var(--line); margin: 4px 0; }
.hero-greet { padding: 8px 0 4px; }
.hero-greet { padding: 18px 0 6px; }
.hero-greet h1 { font-size: 2.75rem; }
.tile { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: var(--r-md); background: var(--surface-2); min-width: 0; }
.tile .big { font-family: var(--font-display); font-size: 1.45rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.avatar { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-weight: 700; font-family: var(--font-display); background: var(--accent-soft); color: var(--accent); flex: none; }
.avatar.lg { width: 64px; height: 64px; border-radius: 20px; font-size: 1.3rem; }
.iconwrap { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.iconwrap.good { background: var(--good-soft); color: var(--good); }
.iconwrap.warn { background: var(--warn-soft); color: var(--warn); }
.iconwrap.bad { background: var(--bad-soft); color: var(--bad); }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 14px; border: 1px solid transparent; font-weight: 650; font-size: var(--fs-md); background: var(--accent); color: var(--accent-ink); transition: transform .15s var(--ease), filter .2s, background .2s; text-decoration: none; white-space: nowrap; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.secondary:hover { background: var(--surface-2); filter: none; }
.btn.ghost { background: transparent; color: var(--accent); padding: 0 10px; }
.btn.ghost:hover { background: var(--accent-soft); filter: none; }
.btn.danger { background: var(--bad); color: #fff; }
.btn.good { background: var(--good); color: #fff; }
.grid-3 > .btn { min-width: 0; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: var(--fs-sm); border-radius: 11px; }
.btn.block { width: 100%; }
.btn.xl { min-height: 56px; font-size: 1.05rem; border-radius: 18px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 650; font-size: var(--fs-sm); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .label { font-size: var(--fs-sm); font-weight: 650; color: var(--ink-2); }
.input, select.input, textarea.input { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); transition: border-color .2s, box-shadow .2s; }
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.input.invalid { border-color: var(--bad); }
.err { color: var(--bad); font-size: var(--fs-sm); font-weight: 600; }
.hint { color: var(--ink-3); font-size: var(--fs-xs); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-weight: 600; font-size: var(--fs-sm); transition: all .18s var(--ease); }
.chip:hover { border-color: var(--accent); color: var(--ink); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.sm { min-height: 30px; padding: 0 10px; font-size: var(--fs-xs); }
.seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 10px; font-weight: 650; font-size: var(--fs-sm); color: var(--ink-2); white-space: nowrap; transition: background .2s, color .2s; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.switch { position: relative; width: 46px; height: 28px; flex: none; border-radius: 99px; background: var(--line); border: 0; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: inset-inline-start .2s var(--ease); }
.switch.on { background: var(--good); }
.switch.on::after { inset-inline-start: 21px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: var(--fs-xs); font-weight: 700; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.plain::before { display: none; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.demo-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; border: 1px dashed var(--ink-3); color: var(--ink-3); white-space: nowrap; }
.search { position: relative; }
.search .ico { position: absolute; top: 50%; transform: translateY(-50%); inset-inline-start: 14px; color: var(--ink-3); }
.search .input { padding-inline-start: 42px; }

/* ---------- Alerts / banners ---------- */
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-md); background: var(--accent-soft); color: var(--ink); }
.banner.good { background: var(--good-soft); }
.banner.warn { background: var(--warn-soft); }
.banner.bad { background: var(--bad-soft); }
.banner .ico { margin-top: 2px; }
.banner.good .ico { color: var(--good); } .banner.warn .ico { color: var(--warn); } .banner.bad .ico { color: var(--bad); } .banner .ico { color: var(--accent); }
.level-card { border-radius: var(--r-lg); padding: 18px; border: 1px solid var(--line); background: var(--surface); position: relative; overflow: hidden; }
.level-card::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 5px; background: var(--good); }
.level-card.amber::before { background: var(--warn); }
.level-card.red::before { background: var(--bad); }
.why { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 10px; }
.why summary { cursor: pointer; font-size: var(--fs-sm); font-weight: 650; color: var(--accent); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
.why summary::-webkit-details-marker { display: none; }
.why ul { margin: 8px 0 0; padding-inline-start: 18px; color: var(--ink-2); font-size: var(--fs-sm); }

/* ---------- Mood ---------- */
.mood { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mood button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); font-weight: 650; font-size: var(--fs-sm); color: var(--ink-2); transition: all .2s var(--ease); }
.mood button:hover { transform: translateY(-2px); border-color: var(--accent); }
.mood button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.mood .face { width: 34px; height: 34px; }

/* ---------- Medication schedule ---------- */
.dose { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.dose:last-child { border-bottom: 0; }
.dose .t { font-family: var(--font-data); font-weight: 600; font-size: .95rem; }
.dose.taken .grow h4 { text-decoration: line-through; text-decoration-color: var(--ink-3); color: var(--ink-2); }
.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: inherit; background: var(--good); transition: width .8s var(--ease); }
.ring { --p: 0; width: 64px; height: 64px; border-radius: 50%; background: conic-gradient(var(--good) calc(var(--p) * 1%), var(--surface-2) 0); display: grid; place-items: center; flex: none; }
.ring > span { width: 50px; height: 50px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 750; font-size: .85rem; font-variant-numeric: tabular-nums; }

/* ---------- Timeline ---------- */
.timeline { position: relative; display: flex; flex-direction: column; gap: 0; }
.tl-item { position: relative; display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding-bottom: 18px; }
.tl-item::before { content: ""; position: absolute; top: 18px; bottom: 0; inset-inline-start: 10px; width: 2px; background: var(--line); }
.tl-item:last-child::before { display: none; }
.tl-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); display: grid; place-items: center; margin-top: 2px; }
.tl-dot.good { border-color: var(--good); } .tl-dot.warn { border-color: var(--warn); } .tl-dot.bad { border-color: var(--bad); }
.tl-date { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 650; }

/* ---------- Flow diagram ---------- */
.flow { display: flex; flex-direction: column; gap: 0; }
.flow-step { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; position: relative; padding-bottom: 12px; }
.flow-step::after { content: ""; position: absolute; top: 30px; bottom: 0; inset-inline-start: 14px; width: 2px; background: var(--line); }
.flow-step:last-child::after { display: none; }
.flow-step .n { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-weight: 750; font-size: var(--fs-xs); background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.flow-step.done .n { background: var(--good-soft); color: var(--good); border-color: transparent; }
.flow-step.now .n { background: var(--accent); color: var(--accent-ink); border-color: transparent; animation: pulse-ring 1.8s infinite; }
.flow-step p { padding-top: 5px; }

/* ---------- Clinic cards ---------- */

const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return isoDate(d); };

/* ---------- password hashing (PBKDF2, WebCrypto) ---------- */
async function hashPassword(pw, salt) {
  salt = salt || Array.from(crypto.getRandomValues(new Uint8Array(16))).map((b) => b.toString(16).padStart(2, "0")).join("");
  const enc = new TextEncoder();

  return { salt, hash: Array.from(new Uint8Array(bits)).map((b) => b.toString(16).padStart(2, "0")).join("") };
}

/* ---------- slot availability ---------- */
function doctorSlots(doc, dateIso) {
  const d = new Date(dateIso + "T12:00:00");
  if (!doc.days.includes(d.getDay())) return [];
  const out = [];
  for (let m = doc.hours[0] * 60; m < doc.hours[1] * 60; m += 30) {
    const hm = minToHm(m);
    if (dateIso === today() && hmToMin(hm) <= hmToMin(nowHM()) + 30) continue;
    if (hashStr(doc.id + dateIso + hm) % 10 < 4) continue; // simulated external bookings
    const taken = DB.appointments.some((a) => a.doctorId === doc.id && a.date === dateIso && a.time === hm && ["confirmed", "rescheduled"].includes(a.status));
    if (!taken) out.push(hm);
  }
  return out;
}
function nextAvailable(doc, from = today(), span = 14) {
  for (let i = 0; i < span; i++) { const d = addDays(from, i); const s = doctorSlots(doc, d); if (s.length) return { date: d, time: s[0], count: s.length }; }
  return null;
}

  },
  async login(identifier, pw) {

    if (u.lockedUntil && Date.now() < u.lockedUntil) throw { code: "err_locked" };
    const { hash } = await hashPassword(pw, u.salt);
    if (hash !== u.pw) { u.failed++; if (u.failed >= 5) { u.lockedUntil = Date.now() + 60000; u.failed = 0; } saveDB(); throw { code: "err_bad_password" }; }

  startSession(u) {

  },
  restore() {

    const u = DB.users.find((x) => x.id === s.userId); if (!u) return false;
    s.lastSeen = new Date().toISOString(); App.user = u; App.sessionId = s.id; App.profile = DB.profiles[u.id] || null; return true;
  },
  logout() {
    const s = DB.sessions.find((x) => x.id === App.sessionId); if (s) s.revoked = true;
    audit("au_logout", null); App.user = null; App.profile = null; App.sessionId = null; safeStore.del(SESSION_KEY); saveDB();
  },
  async signup({ name, identifier, password }) {

    if (isEmail && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(id)) throw { code: "err_email" };
    if (!isEmail && !/^\+?\d{8,15}$/.test(id)) throw { code: "err_phone" };
    if (this.findUser(id)) throw { code: "err_exists" };
    const issues = passwordIssues(password); if (issues.length) throw { code: issues[0] };
    const h = await hashPassword(password);
    const u = { id: uid("u"), email: isEmail ? id : "", phone: isEmail ? "" : id, role: "patient", name: name.trim(), verified: false, pw: h.hash, salt: h.salt, createdAt: new Date().toISOString() };

    this.sendCode(u.id, "verify");

  },
  sendCode(userId, purpose) {
    const code = String(100000 + Math.floor(Math.random() * 900000));
    DB.pendingCodes[userId + ":" + purpose] = { code, exp: Date.now() + 10 * 60000 };
    const u = DB.users.find((x) => x.id === userId);

  checkCode(userId, purpose, code) {

/* Resolve which patient the current actor may act on, and with which scopes. */

  const dup = DB.notifications.find((n) => n.userId === userId && !n.read && n.msg.k === msg.k && JSON.stringify(n.msg.p) === JSON.stringify(msg.p));

  const n = { id: uid("n"), userId, cat, msg, at: opts.at || new Date().toISOString(), read: !!opts.read, action: opts.action || null };

/* ---------- integration abstraction layer ---------- */
/* Every adapter implements: describe(), pull(patientId, clinicId) -> normalized records[], push(patientId, record). */
const Normalizer = {
  // FHIR R4 Bundle -> Wellpoint records
  fromFhir(bundle, clinicId) {
    const out = [];
    for (const { resource: r } of bundle.entry || []) {
      if (r.resourceType === "Encounter") out.push({ kind: "visit", date: r.period?.start?.slice(0, 10), text: r.reasonCode?.[0]?.text || "" });
      if (r.resourceType === "Observation") {
        const code = r.code?.coding?.[0]?.code;
        if (code === "85354-9") out.push({ kind: "measure", type: "bp", value: r.component[0].valueQuantity.value, value2: r.component[1].valueQuantity.value, date: r.effectiveDateTime });
        else if (code === "4548-4") out.push({ kind: "lab", name: "HbA1c", value: r.valueQuantity.value, unit: "%", date: r.effectiveDateTime });
        else if (code === "2339-0") out.push({ kind: "measure", type: "glucose", value: r.valueQuantity.value, unit: "mg/dL", date: r.effectiveDateTime });
      }
      if (r.resourceType === "MedicationRequest") out.push({ kind: "medication", name: r.medicationCodeableConcept?.text, dose: r.dosageInstruction?.[0]?.text, timing: r.dosageInstruction?.[0]?.timing?.code?.text, date: r.authoredOn });
      if (r.resourceType === "Appointment") out.push({ kind: "followup", date: r.start?.slice(0, 10), time: r.start?.slice(11, 16) });
    }
    return out.map((x) => ({ ...x, clinicId }));
  }
};

function ingest(patientId, records, source) {

/* ---------- clinical rules (DEMO — must be reviewed/approved by clinicians before use) ---------- */
const RED_FLAGS = ["chest_pain", "severe_breath", "fainting", "stroke_signs", "severe_bleeding"];
function evaluateRules({ profile, mood, symptoms = [], redFlags = [], bp, glucose }) {
  const reasons = []; let level = "green";
  const cond = profile?.conditions || [];
  const bump = (l) => { const o = { green: 0, amber: 1, red: 2 }; if (o[l] > o[level]) level = l; };
  if (redFlags.length) { bump("red"); reasons.push({ k: "why_redflag", p: { list: redFlags.map((f) => t("sym_" + f)).join(", ") } }); }
  if (bp) {
    if (bp[0] >= 180 || bp[1] >= 120) { bump(redFlags.length ? "red" : "amber"); reasons.push({ k: "why_bp_very_high", p: { v: bp.join("/") } }); if (!redFlags.length) level = "red"; }
    else if (bp[0] >= 140 || bp[1] >= 90) { bump("amber"); reasons.push({ k: "why_bp_high", p: { v: bp.join("/") } }); }
    else if (bp[0] < 90) { bump("amber"); reasons.push({ k: "why_bp_low", p: { v: bp.join("/") } }); }
  }
  if (glucose) {
    if (glucose < 54) { bump("red"); reasons.push({ k: "why_glu_very_low", p: { v: glucose } }); }
    else if (glucose < 70) { bump("amber"); reasons.push({ k: "why_glu_low", p: { v: glucose } }); }
    else if (glucose > 300) { bump("amber"); reasons.push({ k: "why_glu_very_high", p: { v: glucose } }); }
    else if (glucose > 250) { bump("amber"); reasons.push({ k: "why_glu_high", p: { v: glucose } }); }
  }
  if (mood === "worse") {

function freshness(patientId) {

  const m = DB.measurements.filter((x) => x.patientId === patientId);

  const next = DB.appointments.filter((a) => a.patientId === patientId && ["confirmed", "rescheduled"].includes(a.status) && a.date >= today()).sort((a, b) => (a.date + a.time > b.date + b.time ? 1 : -1))[0];
  const rows = [
    { key: "fr_checkin", at: last(DB.checkins.filter((c) => c.patientId === patientId)), stale: 3 },
    { key: "fr_measure", at: last(m.filter((x) => ["bp", "glucose", "weight"].includes(x.type)).slice()), stale: 7 },
    { key: "fr_bp", at: last(m.filter((x) => x.type === "bp")), stale: 7, only: "hypertension" },
    { key: "fr_glucose", at: last(m.filter((x) => x.type === "glucose")), stale: 7, only: "diabetes" },
    { key: "fr_visit", at: last(visits), stale: 120 },

  ];
  const cond = DB.profiles[patientId]?.conditions || [];
  const hasMeds = DB.medications.some((x) => x.patientId === patientId && x.active);
  return { rows: rows.filter((r) => (!r.only || cond.includes(r.only)) && (!r.needsMeds || hasMeds)).map((r) => ({ ...r, days: r.at ? daysBetween(r.at.slice(0, 10), today()) : null })), next };
}

/* ---------- medication schedule + AI-assisted organizer ---------- */
const FREQ_COUNT = { once: 1, twice: 2, thrice: 3, four: 4, weekly: 1, as_needed: 0 };
/* Suggests clock times that FOLLOW the prescribed frequency and food instruction.
   Never changes dose or frequency — only arranges times inside the user's waking day. */
function suggestTimes(freq, food, prefs, existing = []) {
  const n = FREQ_COUNT[freq] ?? 1; if (!n) return { times: [], reasons: [{ k: "why_prn" }] };
  const wake = hmToMin(prefs?.wake || "07:00"), sleep = hmToMin(prefs?.sleep || "23:00");
  const span = (sleep > wake ? sleep : sleep + 1440) - wake;
  const meals = [wake + 30, wake + Math.round(span * 0.42), sleep - 150];
  let times;
  if (n === 1) times = [food === "before" ? meals[0] - 30 : food === "after" ? meals[0] + 30 : wake + 30];
  else if (n === 2) times = [meals[0], meals[2]].map((m) => (food === "before" ? m - 30 : food === "after" ? m + 30 : m));
  else if (n === 3) times = meals.map((m) => (food === "before" ? m - 30 : food === "after" ? m + 30 : m));
  else { const step = Math.floor((span - 60) / 3); times = [0, 1, 2, 3].map((i) => wake + 30 + i * step); }
  times = times.map((m) => Math.round(m / 15) * 15);
  // align with existing doses within 20 min to reduce reminder count
  const ex = existing.map(hmToMin);
  times = times.map((m) => { const near = ex.find((e) => Math.abs(e - m) <= 20); return near ?? m; });
  const reasons = [{ k: "why_times_freq", p: { n } }, { k: "why_times_wake", p: { wake: fmtTime(prefs?.wake || "07:00"), sleep: fmtTime(prefs?.sleep || "23:00") } }];
  if (food !== "any") reasons.push({ k: "why_times_food_" + food });
  if (times.some((m) => ex.includes(m))) reasons.push({ k: "why_times_grouped" });
  reasons.push({ k: "why_times_never_dose" });
  return { times: times.map(minToHm), reasons };
}
function scheduleFor(patientId, dateIso = today()) {
  const meds = DB.medications.filter((m) => m.patientId === patientId && m.active && (!m.start || m.start <= dateIso) && (!m.end || m.end >= dateIso));
  const items = [];
  for (const m of meds) {
    if (m.frequency === "weekly" && new Date(dateIso + "T12:00:00").getDay() !== new Date((m.start || dateIso) + "T12:00:00").getDay()) continue;
    for (const tm of m.times) {
      const log = DB.doseLog.find((d) => d.medId === m.id && d.date === dateIso && d.time === tm);
      items.push({ med: m, time: tm, status: log?.status || (dateIso < today() || (dateIso === today() && hmToMin(tm) < hmToMin(nowHM()) - 120) ? "missed" : "due"), log });
    }
  }
  return items.sort((a, b) => hmToMin(a.time) - hmToMin(b.time));
}
function adherence(patientId, days = 7) {
  let taken = 0, total = 0;
  for (let i = 1; i <= days; i++) for (const it of scheduleFor(patientId, addDays(today(), -i))) { total++; if (it.status === "taken") taken++; }
  return total ? Math.round((taken / total) * 100) : null;
}
function logDose(medId, time, status, dateIso = today()) {

  log.status = status; log.at = new Date().toISOString(); log.by = App.user.id;
  if (App.user.role === "caregiver") { audit("au_caregiver_dose", m.patientId); notify(m.patientId, "caregiver", { k: "n_cg_marked", p: { name: App.user.name.split(" ")[0], med: m.name } }, { silent: true }); }

/* ---------- routine-based medication planner ----------
   Builds clock times from the patient's own routine (wake, meals, sleep, busy hours).
   Frequency, dose and food instructions are inputs and are never changed. */
function planFromRoutine(meds, a) {
  const W = hmToMin(a.wake || "07:00"); let S = hmToMin(a.sleep || "23:00"); if (S <= W) S += 1440;
  const mealAt = { breakfast: a.breakfast ? hmToMin(a.breakfast) : null, lunch: a.lunch ? hmToMin(a.lunch) : null, dinner: a.dinner ? hmToMin(a.dinner) : null };
  const slot = { breakfast: mealAt.breakfast ?? W + 30, lunch: mealAt.lunch ?? Math.round((W + S) / 2), dinner: mealAt.dinner ?? S - 120 };
  const busy = a.busy ? [hmToMin(a.busy[0]), hmToMin(a.busy[1])] : null;
  const OFF = { before: -30, after: 20, with: 0, any: 0 };
  const clamp = (m) => Math.min(Math.max(m, W), S - 15);
  const out = meds.map((med) => {
    const n = FREQ_COUNT[med.frequency] ?? 1; const reasons = [];
    if (!n) return { med, times: [], reasons: [{ k: "why_prn" }] };
    let anchors;
    if (n === 1) {
      const evening = med.times?.[0] && hmToMin(med.times[0]) >= 16 * 60;
      anchors = [evening ? "dinner" : "breakfast"]; if (evening) reasons.push({ k: "why_rt_evening" });
    } else if (n === 2) anchors = ["breakfast", "dinner"];
    else if (n === 3) anchors = ["breakfast", "lunch", "dinner"];
    else anchors = null;
    let times;
    if (anchors) {
      times = anchors.map((meal) => {
        const base = slot[meal];
        if (med.food === "any") reasons.push({ k: "why_rt_any" });
        else if (mealAt[meal] != null) reasons.push({ k: "why_rt_meal_" + med.food, p: { meal: t("meal_" + meal), time: fmtTime(minToHm(mealAt[meal])) } });
        else reasons.push({ k: "why_rt_meal_skipped", p: { meal: t("meal_" + meal) } });
        return base + OFF[med.food];
      });
    } else {
      const step = (S - 30 - (W + 30)) / 3; times = [0, 1, 2, 3].map((i) => Math.round(W + 30 + i * step)); reasons.push({ k: "why_rt_spread" });
    }
    times = times.map((m) => {
      m = clamp(m);
      if (busy && m >= busy[0] && m < busy[1]) {
        if (med.food === "any") { m = clamp(m - busy[0] < busy[1] - m ? busy[0] - 15 : busy[1] + 15); reasons.push({ k: "why_rt_busy" }); }
        else reasons.push({ k: "why_rt_busy_kept" });
      }
      return Math.round(m / 5) * 5;
    });
    return { med, times, reasons };
  });
  if (a.group) {
    const fixed = out.filter((o) => o.med.food !== "any").flatMap((o) => o.times);
    out.filter((o) => o.med.food === "any").forEach((o) => {
      o.times = o.times.map((m) => { const near = fixed.find((f) => Math.abs(f - m) <= 30 && f !== m); if (near != null && !(busy && near >= busy[0] && near < busy[1])) { o.reasons.push({ k: "why_rt_grouped" }); return near; } return m; });
      fixed.push(...o.times);
    });
  }
  return out.map((o) => {
    const seen = new Set();
    return { med: o.med, times: [...new Set(o.times.map(minToHm))].sort(), reasons: o.reasons.filter((r) => { const k = r.k + JSON.stringify(r.p || {}); if (seen.has(k)) return false; seen.add(k); return true; }) };
  });
}

/* ---------- ringing alarm: sound + vibration until the user responds ---------- */
const Ring = {
  ctx: null, timer: null, note: null, lock: null,
  unlock() { try { this.ctx ??= new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === "suspended") this.ctx.resume(); } catch {} },
  chime() {
    const c = this.ctx; if (!c) return; const now = c.currentTime;
    [880, 1108.7, 1318.5].forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain(), d = now + i * 0.18;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, d); g.gain.exponentialRampToValueAtTime(0.28, d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, d + 0.55);
      o.connect(g).connect(c.destination); o.start(d); o.stop(d + 0.6);
    });
  },
  start(title, body, tag) {
    this.stop(); this.unlock();
    const pr = DB.profiles[App.user?.id]?.prefs || {};
    const tick = () => { if (pr.alarmSound !== false) this.chime(); if (pr.alarmVibrate !== false) { try { navigator.vibrate?.([500, 250, 500, 250, 500]); } catch {} } };
    tick(); this.timer = setInterval(tick, 2600);
    try { if ("Notification" in window && Notification.permission === "granted") this.note = new Notification(title, { body, tag, requireInteraction: true, renotify: true, silent: false }); } catch {}
    try { navigator.wakeLock?.request("screen").then((l) => (this.lock = l)).catch(() => {}); } catch {}
  },
  stop() {
    clearInterval(this.timer); this.timer = null;
    try { navigator.vibrate?.(0); } catch {}
    try { this.note?.close(); } catch {} this.note = null;
    try { this.lock?.release(); } catch {} this.lock = null;
  }
};

function render(opts = {}) {
  const y = window.scrollY;
  const app = $("#app");
  document.body.classList.toggle("simple", !!App.profile?.simple);
  document.documentElement.setAttribute("data-size", App.profile?.simple ? "large" : "normal");
  let html;
  try { html = routeHtml(); } catch (e) { console.error(e); html = `<div class="patient-shell"><div class="empty" style="margin-top:40px">${icon("alert")}<h4>${esc(t(e.code || "err_generic"))}</h4><button class="btn" data-go="home">${esc(t("go_home"))}</button></div></div>`; }
  const openFolds = opts.scrollTop ? [] : $$("details[id][open]", app).map((d) => d.id);
  app.classList.toggle("entering", !!opts.scrollTop || !render.done);
  app.innerHTML = html;
  openFolds.forEach((id) => { const d = document.getElementById(id); if (d) d.open = true; });
  renderLayer();
  if (opts.scrollTop) window.scrollTo(0, 0); else window.scrollTo(0, y);
  armReveal();
  if (opts.scrollTop || !render.done) afterRender();
  render.done = true;
}
function armReveal() {
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches || CSS.supports?.("animation-timeline: view()")) return;
  const els = $$(".page > *, .page .reveal, .page .stack > .card").filter((el) => el.getBoundingClientRect().top > innerHeight - 20);
  const io = new IntersectionObserver((ents) => {
    let i = 0;
    ents.forEach((en) => { if (en.isIntersecting) { en.target.style.transitionDelay = Math.min(i++, 3) * 60 + "ms"; en.target.classList.add("in"); io.unobserve(en.target); } });
  }, { threshold: 0.08, rootMargin: "0px 0px -6% 0px" });
  els.forEach((el) => { el.classList.add("reveal-armed"); io.observe(el); });
}
function afterRender() {
  $$("[data-count]").forEach((el) => {
    const target = Number(el.dataset.count); if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const t0 = performance.now(); const suffix = el.dataset.suffix || "";
    const step = (tt) => { const k = Math.min(1, (tt - t0) / 700); el.textContent = fmtNum(Math.round(target * (1 - Math.pow(1 - k, 3)))) + suffix; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function routeHtml() {
  const u = App.user; const r = UI.route.name;
  if (!u) return ({ login: authView, signup: authView, verify: authView, forgot: authView, reset: authView, platform: platformView }[r] || authView)();

}

function PID() {

  return link ? link.patientId : null;
}
function SCOPE() { const id = PID(); if (!id) return null; return patientScope(id); }
const allow = (k) => { const s = SCOPE(); return !!s && (s.all || !!s[k]); };
const PROF = () => DB.profiles[PID()] || {};
const isCaregiver = () => App.user.role === "caregiver";

function upcomingAppts(pid) { return DB.appointments.filter((a) => a.patientId === pid && ["confirmed", "rescheduled"].includes(a.status) && (a.date > today() || (a.date === today() && a.time >= nowHM()))).sort((a, b) => (a.date + a.time > b.date + b.time ? 1 : -1)); }

function greetingKey() { const h = new Date().getHours(); return h < 12 ? "good_morning" : h < 17 ? "good_afternoon" : "good_evening"; }
function oneThing(pid) {
  const p = DB.profiles[pid];
  const lastCi = DB.checkins.filter((c) => c.patientId === pid).sort((a, b) => (a.at < b.at ? 1 : -1))[0];
  if (lastCi && lastCi.level !== "green" && daysBetween(lastCi.at.slice(0, 10), today()) <= 2 && !lastCi.resolved) return { key: "focus_followup", act: "book-followup", cta: "book_followup", reasons: [{ k: "why_recent_amber" }], clinical: true };
  const y = scheduleFor(pid, addDays(today(), -1)); const missedY = y.filter((i) => i.status === "missed").length;
  if (missedY) return { key: "focus_meds", p: { n: missedY }, go: "meds", cta: "open_meds", reasons: [{ k: "why_missed_yesterday", p: { n: missedY } }, { k: "why_no_dose_advice" }] };
  const fr = freshness(pid).rows.find((r) => r.key === "fr_checkin");
  if ((p.mode === "chronic") && (fr?.days == null || fr.days >= 3)) return { key: "focus_checkin", go: "checkin", cta: "check_in_now", reasons: [{ k: "why_stale", p: { d: fr?.days ?? "—" } }, { k: "why_stale_not_worse" }] };
  const sl = DB.measurements.filter((m) => m.patientId === pid && m.type === "sleep").slice(-7);
  const avg = sl.length ? sl.reduce((a, b) => a + b.value, 0) / sl.length : null;
  const poor = DB.journal.filter((j) => j.patientId === pid && j.tags.includes("poor_sleep") && daysBetween(j.at.slice(0, 10), today()) <= 7).length;
  if (avg != null && avg < 7) return { key: "focus_sleep", p: { h: fmtNum(avg, { maximumFractionDigits: 1 }) }, go: "summary", cta: "see_week", reasons: [{ k: "why_sleep_avg", p: { h: fmtNum(avg, { maximumFractionDigits: 1 }) } }, ...(poor ? [{ k: "why_sleep_journal", p: { n: poor } }] : []), { k: "why_wellness_only" }] };
  const next = upcomingAppts(pid)[0];
  if (next && daysBetween(today(), next.date) <= 3) return { key: "focus_prepare", go: "ai", cta: "prepare_questions", reasons: [{ k: "why_appt_soon" }] };
  return { key: "focus_walk", go: "journal", cta: "open_journal", reasons: [{ k: "why_default_focus" }, { k: "why_wellness_only" }] };
}

function submitCheckin() {
  const pid = PID(); const ci = UI.ci; const p = DB.profiles[pid];
  const bpm = /^(\d{2,3})\s*\/\s*(\d{2,3})$/.exec(ci.bp || "");
  const bp = bpm ? [Number(bpm[1]), Number(bpm[2])] : null; const glucose = ci.glucose ? Number(ci.glucose) : null;
  const res = evaluateRules({ profile: p, mood: ci.mood, symptoms: ci.symptoms, redFlags: ci.redFlags, bp, glucose });
  const rec = { id: uid("ci"), patientId: pid, at: new Date().toISOString(), mood: ci.mood, symptoms: [...ci.symptoms, ...ci.redFlags], level: res.level, by: isCaregiver() ? "caregiver" : "patient" };
  DB.checkins.push(rec);
  if (bp) DB.measurements.push({ id: uid("ms"), patientId: pid, type: "bp", value: bp[0], value2: bp[1], at: rec.at, source: rec.by });
  if (glucose) DB.measurements.push({ id: uid("ms"), patientId: pid, type: "glucose", value: glucose, unit: "mg/dL", at: rec.at, source: rec.by });
  DB.timeline.push({ id: uid("tl"), patientId: pid, at: rec.at, type: "checkin", msg: { k: rec.symptoms.length ? "tl_checkin_sym" : "tl_checkin", p: { mood: { k: "mood_" + ci.mood }, list: rec.symptoms.map((s) => t("sym_" + s)).join(", ") } }, source: rec.by, level: res.level === "green" ? null : res.level === "amber" ? "warn" : "bad" });
  if (res.level !== "green") {
    notify(pid, "health", { k: res.level === "red" ? "n_red" : "n_amber" }, { silent: true });
    const cg = DB.caregivers.filter((c) => c.patientId === pid && c.status === "active" && c.perms.health && c.caregiverUserId);
    if (p.consent?.shareWithCaregivers) cg.forEach((c) => { if (c.caregiverUserId !== App.user.id) { notify(c.caregiverUserId, "caregiver", { k: "n_cg_alert", p: { name: firstName(p.name), level: { k: "lvl_" + res.level } } }, { silent: true }); sendEmail(c.caregiverUserId, "email_caregiver", { name: firstName(p.name) }); res.notifiedCg = true; } });
  }
  if (isCaregiver()) audit("au_caregiver_checkin", pid);
  saveDB(); ci.result = res; ci.step = 3; render({ scrollTop: true });
}

  const sleep = DB.measurements.filter((m) => m.patientId === pid && m.type === "sleep" && inRange(m.at));
  const avgSleep = sleep.length ? sleep.reduce((a, b) => a + b.value, 0) / sleep.length : null;
  const adh = per === "day" ? (() => { const s = scheduleFor(pid); return s.length ? Math.round((s.filter((i) => i.status === "taken").length / s.length) * 100) : null; })() : adherence(pid, days);
  const done = DB.appointments.filter((a) => a.patientId === pid && a.status === "completed" && a.date > since).length;
  const updates = DB.timeline.filter((x) => x.patientId === pid && inRange(x.at)).length;

function localPatterns(pid) {

  const co = e.filter((x) => x.tags.includes("poor_sleep") && x.tags.includes("stress")).length;

function chatMsg(m, i) {
  if (m.role === "user") return `<div class="msg me">${esc(m.text)}</div>`;
  return `<div class="msg ai ${m.emergency ? "emergency" : ""} ${m.pending ? "thinking" : ""}" id="msg-${i}">${esc(m.text)}${m.used?.length ? `<span class="meta">${esc(t("ai_used"))}: ${m.used.map((u) => t(u)).join(", ")}${m.via ? " · " + esc(t(m.via)) : ""}</span>` : m.via ? `<span class="meta">${esc(t(m.via))}</span>` : ""}</div>`;
}
let aiCtl = null;
async function askAI(q) {
  const pid = PID(); if (!q.trim() || UI.chatBusy) return;
  UI.chat.push({ role: "user", text: q });
  if (isEmergencyText(q)) { UI.chat.push({ role: "assistant", text: t("ai_emergency"), emergency: true, via: "ai_via_safety" }); render(); scrollChat(); return; }
  const sample = UI.aiLive ? await window.claude.use("sample").catch(() => null) : null;
  if (!sample) { const a = aiLocalAnswer(q, pid); UI.chat.push({ role: "assistant", text: a.text, used: a.used, emergency: a.emergency, via: "ai_via_local" }); render(); scrollChat(); return; }
  const msg = { role: "assistant", text: t("thinking"), pending: true, via: "ai_via_live", used: ["src_profile", "src_meds", "src_appts", "src_health"] };
  UI.chat.push(msg); UI.chatBusy = true; render(); scrollChat();
  const idx = UI.chat.length - 1;
  aiCtl = new AbortController();
  const turns = [{ role: "user", content: aiRules({ en: "English", ar: "Arabic", zh: "Simplified Chinese" }[I18N.lang], pid) }, { role: "assistant", content: "Understood. I'll follow those rules." }];
  UI.chat.slice(1, -2).slice(-8).forEach((m) => turns.push({ role: m.role === "user" ? "user" : "assistant", content: m.text }));
  turns.push({ role: "user", content: q });
  try {
    const { text } = await sample(turns, { cache: false, signal: aiCtl.signal, modelTier: "quick", onText: ({ text }) => { msg.text = text; msg.pending = false; const el = $("#msg-" + idx); if (el) { el.classList.remove("thinking"); el.firstChild.textContent = text; } } });
    msg.text = text; msg.pending = false;
  } catch (e) {
    msg.pending = false;
    if (e.code === "cancelled") msg.text = e.text || t("ai_stopped");
    else { if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled"].includes(e.code)) UI.aiLive = false; const a = aiLocalAnswer(q, pid); msg.text = a.text; msg.used = a.used; msg.via = "ai_via_local"; }
  }
  UI.chatBusy = false; render(); scrollChat();
}
function scrollChat() { const c = $("#chat"); if (c) c.lastElementChild?.scrollIntoView({ block: "end", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }

const RT_STEPS = ["wake", "breakfast", "lunch", "dinner", "sleep", "busy", "group"];

function routineView() {

function submitPostVisit(form) {
  requirePerm("clinical.update");
  const a = DB.appointments.find((x) => x.id === form.dataset.id); if (!a || a.clinicId !== App.user.clinicId) throw { code: "err_forbidden" };
  const p = DB.profiles[a.patientId]; if (!p?.consent?.shareWithClinics) throw { code: "patient_no_consent" };
  const fd = new FormData(form); const c = myClinic(); const pid = a.patientId;
  const recs = [];
  if (fd.get("note")) recs.push({ kind: "visit", text: fd.get("note"), clinicId: c.id });
  const bpm = /^(\d{2,3})\s*\/\s*(\d{2,3})$/.exec(fd.get("bp") || ""); if (bpm) recs.push({ kind: "measure", type: "bp", value: +bpm[1], value2: +bpm[2], date: new Date().toISOString(), clinicId: c.id });
  if (fd.get("glucose")) recs.push({ kind: "measure", type: "glucose", value: +fd.get("glucose"), unit: "mg/dL", date: new Date().toISOString(), clinicId: c.id });
  ingest(pid, recs, "clinic");
  if (fd.get("med")) {
    const sug = suggestTimes(fd.get("freq"), fd.get("food"), p.prefs, DB.medications.filter((m) => m.patientId === pid && m.active).flatMap((m) => m.times));
    DB.medications.push({ id: uid("med"), patientId: pid, name: fd.get("med"), dose: fd.get("dose"), frequency: fd.get("freq"), times: sug.times, food: fd.get("food"), start: today(), end: "", notes: "", doctor: a.doctorId, clinic: c.id, source: "clinic", verified: true, active: true });
    DB.timeline.push({ id: uid("tl"), patientId: pid, at: new Date().toISOString(), type: "medication", msg: { k: "tl_med_added", p: { med: fd.get("med") + " " + fd.get("dose") } }, source: "clinic" });
  }
  if (fd.get("followup")) {
    const d = DOCTORS.find((x) => x.id === a.doctorId); const slots = doctorSlots(d, fd.get("followup"));
    DB.appointments.push({ id: uid("apt"), patientId: pid, clinicId: c.id, doctorId: d.id, specialty: a.specialty, date: fd.get("followup"), time: slots[0] || "10:00", type: "follow_up", notes: "", status: "confirmed", history: [{ at: new Date().toISOString(), status: "confirmed" }], createdAt: new Date().toISOString() });
    DB.timeline.push({ id: uid("tl"), patientId: pid, at: new Date().toISOString(), type: "plan", msg: { k: "tl_followup_set", p: { date: fd.get("followup") } }, source: "clinic" });
    sendEmail(pid, "email_followup", { clinic: c.name, date: fd.get("followup") });
  }
  const link = (DB.integrations[pid] ||= []); const ex = link.find((i) => i.clinicId === c.id); if (ex) ex.lastSync = new Date().toISOString(); else link.push({ clinicId: c.id, adapter: "manual", status: "connected", lastSync: new Date().toISOString() });
  notify(pid, "clinic", { k: "n_clinic_update", p: { clinic: c.name } }, { silent: true });
  audit("au_clinic_update", pid); saveDB(); closeSheet(); toast(t("sent_to_patient")); render();
}

      <li>Backend, database and sessions (browser localStorage). Emails/SMS go to a visible simulated outbox.</li>
      <li>Doctors, schedules, fees, ratings, services, opening hours and clinic images are placeholders. Facility names/locations come from public listings; verified fields are marked per clinic.</li>
      <li>FHIR / mock sync returns synthetic observations. Device data (sleep) is synthetic.</li>
      <li>Clinical thresholds are illustrative only and not clinically validated.</li>
      <li>Payments (Wellpoint Plus) are a toggle; no billing.</li></ul></section>
    <section class="card stack"><h3>Needs real credentials / external APIs</h3><ul><li>Email (e.g. Amazon SES), SMS gateway (Omantel/Ooredoo aggregator), push (FCM/APNs).</li><li>LLM provider API key via server-side ai-gateway.</li><li>Maps/directions API, calendar sync (Google/Microsoft), payment gateway (e.g. local acquiring bank).</li><li>Apple HealthKit / Google Health Connect entitlements.</li></ul></section>
    <section class="card stack"><h3>Needs healthcare-provider agreements</h3><ul><li>MOH licensed-establishment and practitioner directory access (open data terms) and verification workflow.</li><li>Data-sharing agreements + technical onboarding with each clinic/hospital EMR (FHIR or custom API).</li><li>Any national health record / Shifa integration: official MOH approval required.</li><li>Lab and pharmacy partnerships; clinical governance sign-off for alert rules; PDPL compliance review and DPIA.</li></ul></section>
    <section class="card stack"><h3>Monetization-ready design</h3><ul><li>B2C: Wellpoint Plus (caregiver circle, advanced summaries, document storage, priority reminders).</li><li>B2B: clinic subscription (dashboard, follow-up tools, messaging, integrations) — plan field on clinic tenant.</li><li>Enterprise: hospital group contracts, SSO, custom integrations, SLAs.</li><li>Marketplace: booking/service fees where legally and commercially appropriate; lab/pharmacy partnerships where permitted.</li><li><b>Never</b>: selling patient health data.</li></ul></section>
    <section class="card stack"><h3>Recommended next steps</h3><ol><li>Clinical governance: review rules, thresholds, symptom sets, copy with physicians; define escalation protocols.</li><li>Replace seed directory with MOH open-data import + clinic self-verification portal.</li><li>Build production backend (auth, RLS, audit) and native apps; pen-test; PDPL DPIA.</li><li>Pilot with 2–3 clinics using manual + FHIR adapters; measure adherence and check-in engagement.</li><li>Native alarm-style reminders, offline mode, accessibility audit (WCAG 2.2 AA, Arabic screen readers).</li><li>Pursue lab/pharmacy and national-system partnerships.</li></ol></section>
  </div>`;
  if (inApp && App.user.role !== "clinic") return shell(`${header(t("about_platform"), { back: true })}<div class="page">${body}</div>`, { tab: "profile" });
  return `<div class="patient-shell" style="max-width:820px;padding-bottom:40px">${inApp ? "" : `<header class="topbar"><button class="icon-btn" data-act="back">${flipIcon("back")}</button><span class="brand">${BRAND_SVG}<span>Wellpoint</span></span><div class="grow"></div>${langSwitcher()}</header>`}<div class="page">${body}</div></div>`;
}

  consent: (el) => { const c = DB.profiles[App.user.id].consent; c[el.dataset.k] = !c[el.dataset.k]; audit(c[el.dataset.k] ? "au_consent_on" : "au_consent_off", App.user.id); saveDB(); toast(t("saved")); render(); },
  revoke: (el) => { const s = DB.sessions.find((x) => x.id === el.dataset.id); s.revoked = true; audit("au_session_revoked", App.user.id); saveDB(); render(); },
  "delete-account": () => confirmSheet({ title: t("delete_account"), body: t("delete_account_confirm"), cta: t("delete_forever"), danger: true, typed: "DELETE", onYes: () => { api.auth.deleteAccount(); UI.stack = []; go("login", {}, { replace: true }); toast(t("account_deleted")); } }),
  "toggle-plan": () => { const me = DB.profiles[App.user.id]; me.plan = me.plan === "plus" ? "free" : "plus"; saveDB(); toast(t(me.plan === "plus" ? "plus_on" : "plus_off")); render(); },
  "cg-perm": (el) => { const c = DB.caregivers.find((x) => x.id === el.dataset.id); c.perms[el.dataset.k] = !c.perms[el.dataset.k]; audit("au_cg_perm_change", c.patientId); saveDB(); render(); },
  "cg-remove": (el) => { const c = DB.caregivers.find((x) => x.id === el.dataset.id); confirmSheet({ title: t("remove_access"), body: t("remove_access_d", { name: c.name }), cta: t("remove_access"), danger: true, onYes: () => { c.status = "removed"; audit("au_cg_removed", c.patientId); if (c.caregiverUserId) notify(c.caregiverUserId, "caregiver", { k: "n_cg_removed" }, { silent: true }); saveDB(); toast(t("access_removed")); render(); } }); },
  "cg-accept": (el) => { const c = DB.caregivers.find((x) => x.id === el.dataset.id); c.status = "active"; audit("au_cg_accepted", c.patientId); saveDB(); toast(t("cg_accepted_sim")); render(); },
  // clinic
  cnav: (el) => { UI.clinicNav = el.dataset.v; render({ scrollTop: true }); },
  "c-status": (el) => {
    try { requirePerm("appointments.write"); const a = DB.appointments.find((x) => x.id === el.dataset.id); if (a.clinicId !== App.user.clinicId) throw { code: "err_forbidden" };
      a.status = el.dataset.v; a.history.push({ at: new Date().toISOString(), status: a.status, by: App.user.id }); const c = myClinic();
      DB.timeline.push({ id: uid("tl"), patientId: a.patientId, at: new Date().toISOString(), type: a.status === "completed" ? "visit" : "appointment", msg: { k: a.status === "completed" ? "tl_visit" : a.status === "no_show" ? "tl_appt_noshow" : "tl_appt_cancelled", p: { clinic: c.name, spec: { k: "sp_" + a.specialty } } }, source: "clinic", level: a.status === "no_show" ? "warn" : null });
      notify(a.patientId, "appointments", { k: "n_appt_status", p: { clinic: c.name, status: { k: "st_" + a.status } } }, { silent: true });
      if (a.status === "cancelled") sendEmail(a.patientId, "email_appt_change", { clinic: c.name, date: a.date, time: a.time });
      audit("au_appt_status", a.patientId); saveDB(); toast(t("status_updated")); render();
    } catch (e) { toast(errMsg(e), "alert"); render(); }
  },
  "c-patient": (el) => { try { requirePerm("patients.basic"); openSheet(() => clinicPatientSheet(el.dataset.id)); } catch (e) { toast(errMsg(e), "alert"); } },
  "c-update": (el) => { const a = DB.appointments.find((x) => x.id === el.dataset.id); if (!can("clinical.update")) { toast(t("err_forbidden"), "alert"); return; } if (!DB.profiles[a.patientId]?.consent?.shareWithClinics) { toast(t("patient_no_consent"), "lock"); return; } openSheet(() => postVisitSheet(a)); },
  "c-msg": (el) => { UI.cMsgTo = el.dataset.id; UI.clinicNav = "messages"; render({ scrollTop: true }); },
  "c-staff-toggle": (el) => { try { requirePerm("staff.manage"); const s = DB.staff.find((x) => x.userId === el.dataset.id && x.clinicId === App.user.clinicId); s.active = !s.active; const u = DB.users.find((x) => x.id === s.userId); if (!s.active) DB.sessions.filter((x) => x.userId === u.id).forEach((x) => (x.revoked = true)); audit("au_staff_change", null); saveDB(); render(); } catch (e) { toast(errMsg(e), "alert"); } }
};
const FORMS = {
  async login(form) {
    const id = form.querySelector("#li-id").value, pw = form.querySelector("#li-pw").value;
    if (!id.trim() || !pw) { UI.auth.err = "err_required"; render(); return; }
    try { await api.auth.login(id, pw); UI.auth.err = ""; afterLogin(); }
    catch (e) { UI.auth.err = e.code; if (e.code === "err_unverified") { UI.auth.pending = e.userId; api.auth.sendCode(e.userId, "verify"); go("verify"); return; } render(); }
  },
  async signup(form) {
    const name = form.querySelector("#su-name").value.trim(), id = form.querySelector("#su-id").value, pw = form.querySelector("#su-pw").value;
    if (!name || !id.trim() || !pw) { UI.auth.err = "err_required"; render(); return; }
    if (!form.querySelector("#su-terms").checked) { UI.auth.err = "err_terms"; render(); return; }
    try { const u = await api.auth.signup({ name, identifier: id, password: pw }); UI.auth.err = ""; UI.auth.pending = u.id; go("verify"); } catch (e) { UI.auth.err = e.code; render(); }
  },
  verify(form) {
    try { api.auth.verify(UI.auth.pending, form.querySelector("#vf-code").value); UI.auth.err = ""; UI.ob = { step: 0, data: { name: App.user.name, wake: "07:00", sleep: "23:00", quietStart: "22:30", quietEnd: "06:30", medFreq: "once" } }; saveDB(); render({ scrollTop: true }); toast(t("verified_ok")); }
    catch (e) { UI.auth.err = e.code; render(); }
  },
  forgot(form) {
    const u = api.auth.findUser(form.querySelector("#fg-id").value || "");
    // same response whether or not the account exists (no account enumeration)
    if (u) { api.auth.sendCode(u.id, "reset"); UI.auth.resetUser = u.id; } else UI.auth.resetUser = null;
    UI.auth.err = ""; toast(t("reset_sent_generic")); go("reset");
  },
  async reset(form) {
    if (!UI.auth.resetUser) { UI.auth.err = "err_code_wrong"; render(); return; }
    try { await api.auth.reset(UI.auth.resetUser, form.querySelector("#rs-code").value, form.querySelector("#rs-pw").value); UI.auth.err = ""; toast(t("pw_reset_ok")); go("login", {}, { replace: true }); } catch (e) { UI.auth.err = e.code; render(); }
  },
  "change-pw": async (form) => { try { await api.auth.changePassword(form.querySelector("#cp-old").value, form.querySelector("#cp-new").value); form.reset(); toast(t("pw_changed")); render(); } catch (e) { toast(errMsg(e), "alert"); } },
  med(form) {
    const f = UI.medForm; const pid = PID();
    if (!f.name.trim()) { toast(t("err_med_name"), "alert"); $("#m-name")?.focus(); return; }
    if (f.end && f.start && f.end < f.start) { toast(t("err_end_before"), "alert"); return; }
    const rec = { name: f.name.trim(), dose: f.dose.trim(), frequency: f.frequency, times: [...f.times].sort(), food: f.food, start: f.start, end: f.end, notes: f.notes, doctor: f.doctor, clinic: f.clinic };
    if (f.id) { const m = DB.medications.find((x) => x.id === f.id); if (m.verified) { Object.assign(m, { times: rec.times, notes: rec.notes, end: rec.end }); } else Object.assign(m, rec); DB.timeline.push({ id: uid("tl"), patientId: pid, at: new Date().toISOString(), type: "medication", msg: { k: "tl_med_changed", p: { med: m.name } }, source: "patient" }); }
    else { DB.medications.push({ id: uid("med"), patientId: pid, ...rec, source: "patient", verified: false, active: true, createdAt: new Date().toISOString() }); DB.timeline.push({ id: uid("tl"), patientId: pid, at: new Date().toISOString(), type: "medication", msg: { k: "tl_med_added", p: { med: rec.name } }, source: "patient" }); notify(pid, "medications", { k: "n_med_added", p: { med: rec.name } }, { silent: true }); }
    saveDB(); UI.medForm = null; toast(t("saved")); back("meds");
  },
  measure(form) {
    const f = UI.meas; const pid = PID(); let rec, bp, glucose;
    if (f.type === "bp") { const s = +f.sys, d = +f.dia; if (!(s >= 50 && s <= 260 && d >= 30 && d <= 160 && s > d)) { toast(t("err_bp_range"), "alert"); return; } rec = { type: "bp", value: s, value2: d }; bp = [s, d]; }
    else { const v = +f.value; const lim = { glucose: [20, 600], weight: [2, 400], sleep: [0, 24] }[f.type]; if (!(v >= lim[0] && v <= lim[1])) { toast(t("err_value_range"), "alert"); return; } rec = { type: f.type, value: v }; if (f.type === "glucose") glucose = v; }
    DB.measurements.push({ id: uid("ms"), patientId: pid, ...rec, unit: { glucose: "mg/dL" }[f.type], at: new Date().toISOString(), source: isCaregiver() ? "caregiver" : "patient" });
    DB.timeline.push({ id: uid("tl"), patientId: pid, at: new Date().toISOString(), type: "measure", msg: { k: isCaregiver() ? "tl_measure_by" : "tl_measure", p: { what: { k: "m_" + f.type }, val: f.type === "bp" ? `${rec.value}/${rec.value2}` : String(rec.value), who: firstName(App.user.name) } }, source: isCaregiver() ? "caregiver" : "patient" });
    if (isCaregiver()) audit("au_caregiver_measure", pid);
    saveDB(); UI.meas = { type: f.type, sys: "", dia: "", value: "" };
    const out = $("#meas-result");
    if (bp || glucose) { const res = evaluateRules({ profile: PROF(), bp, glucose }); render(); $("#meas-result").innerHTML = levelCard(res, res.level === "green" ? "" : `<div><button class="btn sm" data-act="book-followup">${esc(t("book_followup"))}</button></div>`); }
    else { render(); toast(t("saved")); }
  },
  chat(form) { const q = form.querySelector("#chat-in").value; form.querySelector("#chat-in").value = ""; askAI(q); },
  profile(form) {
    const f = UI.pf, me = DB.profiles[App.user.id];
    if (!f.name.trim()) { toast(t("err_required"), "alert"); return; }
    Object.assign(me, { name: f.name.trim(), dob: f.dob, gender: f.gender, weight: Number(f.weight) || null, height: Number(f.height) || null, gov: f.gov, nationality: f.nationality, emergency: { name: f.ecName, phone: f.ecPhone }, allergies: f.allergies.split(",").map((x) => x.trim()).filter(Boolean), primaryClinic: f.primaryClinic, conditions: f.conditions, goals: f.goals });
    App.user.name = me.name; UI.pf = null; saveDB(); toast(t("saved")); back("profile");
  },
  "cg-invite": (form) => {
    const fd = new FormData(form); const email = String(fd.get("email") || "").trim().toLowerCase(); const name = String(fd.get("name") || "").trim();
    if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast(t("err_email"), "alert"); return; }
    const perms = Object.fromEntries(PERM_KEYS.map((k) => [k, !!fd.get("perm_" + k)]));
    const existing = DB.users.find((u) => u.email === email);
    DB.caregivers.push({ id: uid("cg"), patientId: App.user.id, caregiverUserId: existing?.id || null, name, email, relation: fd.get("relation"), perms, status: "invited", invitedAt: new Date().toISOString() });
    DB.emails.unshift({ id: uid("em"), userId: App.user.id, to: email, channel: "email", template: "email_cg_invite", params: { name: DB.profiles[App.user.id].name }, lang: I18N.lang, at: new Date().toISOString() });
    audit("au_cg_invited", App.user.id); saveDB(); toast(t("invite_sent")); render();
  },
  "c-message": (form) => { try { requirePerm("messages.write"); const fd = new FormData(form); const pid = fd.get("patient"); if (!clinicAppts().some((a) => a.patientId === pid)) throw { code: "err_forbidden" }; const text = String(fd.get("text") || "").trim(); if (!text) return; DB.messages.push({ id: uid("m"), clinicId: App.user.clinicId, patientId: pid, from: "clinic", text, at: new Date().toISOString() }); notify(pid, "clinic", { k: "n_clinic_msg", p: { clinic: myClinic().name } }, { silent: true }); sendEmail(pid, "email_clinic_msg", { clinic: myClinic().name }); audit("au_clinic_msg", pid); saveDB(); toast(t("message_sent")); render(); } catch (e) { toast(errMsg(e), "alert"); } },
  "c-profile": (form) => { try { requirePerm("clinic.profile"); const fd = new FormData(form); DB.clinicEdits[App.user.clinicId] = { about: fd.get("about"), hours: fd.get("hours") }; audit("au_clinic_profile", null); saveDB(); toast(t("saved")); render(); } catch (e) { toast(errMsg(e), "alert"); } },
  "c-staff": async (form) => { try { requirePerm("staff.manage"); const fd = new FormData(form); const email = String(fd.get("email")).trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || DB.users.some((u) => u.email === email)) throw { code: "err_email" }; const tmp = "Temp" + Math.floor(1000 + Math.random() * 9000) + "x"; const h = await hashPassword(tmp); const u = { id: uid("u"), email, role: "clinic", clinicId: App.user.clinicId, staffRole: fd.get("role"), name: String(fd.get("name")), verified: true, pw: h.hash, salt: h.salt }; DB.users.push(u); DB.staff.push({ userId: u.id, clinicId: u.clinicId, staffRole: u.staffRole, name: u.name, email, active: true }); DB.emails.unshift({ id: uid("em"), userId: App.user.id, to: email, channel: "email", template: "email_staff_invite", params: { clinic: myClinic().name, pw: tmp }, lang: I18N.lang, at: new Date().toISOString() }); audit("au_staff_change", null); saveDB(); toast(t("staff_added", { pw: tmp })); render(); } catch (e) { toast(errMsg(e), "alert"); } },
  "c-update": (form) => { try { submitPostVisit(form); } catch (e) { toast(errMsg(e), "alert"); } }
};
function afterLogin() {
  const p = DB.profiles[App.user.id]; if (p?.lang) setLang(p.lang);
  UI.stack = []; UI.chat = []; UI.pf = null; UI.medForm = null; UI.ci = null;
  if (App.user.role === "clinic") { UI.clinicNav = "overview"; }
  go("home", {}, { replace: true });
}

function rtNext() {
  const r = UI.rt; r.step++;
  if (r.step >= RT_STEPS.length) {
    const meds = DB.medications.filter((m) => m.patientId === PID() && m.active && FREQ_COUNT[m.frequency]);
    r.plan = planFromRoutine(meds, r.a); render();
    setTimeout(() => document.getElementById("rt-result")?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }), 60);
    rtExplain(); return;
  }
  render(); setTimeout(() => { const q = document.getElementById("rt-q"); q?.scrollIntoView({ behavior: "smooth", block: "center" }); document.getElementById("rt-in")?.focus({ preventScroll: true }); }, 60);
}
async function rtExplain() {
  const sample = UI.aiLive ? await window.claude.use("sample").catch(() => null) : null; if (!sample) return;
  const r = UI.rt; const out = () => document.getElementById("rt-ai"); if (!r?.plan) return;
  const lang = { en: "English", ar: "Arabic", zh: "Simplified Chinese" }[I18N.lang];
  const prompt = `You are Wellpoint AI. Reply only in ${lang}, in 2 short warm sentences, no lists. Explain how this medication schedule fits the person's routine. Do not change, add or question any time, dose or frequency, and give no medical advice.\nRoutine: wake ${r.a.wake}, breakfast ${r.a.breakfast || "skipped"}, lunch ${r.a.lunch || "skipped"}, dinner ${r.a.dinner || "skipped"}, bed ${r.a.sleep}, busy ${r.a.busy ? r.a.busy.join("-") : "none"}.\nSchedule: ` + r.plan.map((o) => `${o.med.name} (${o.med.food} food): ${o.times.join(", ")}`).join("; ");
  if (out()) out().innerHTML = `<span class="thinking">${esc(t("thinking"))}</span>`;
  try { const { text } = await sample(prompt, { modelTier: "quick" }); if (out()) out().innerHTML = `<div class="banner">${icon("sparkle")}<span>${esc(text)}</span></div>`; } catch { if (out()) out().textContent = ""; }
}

/* ---------- delegation ---------- */
document.addEventListener("click", (ev) => {
  Ring.unlock();
  const el = ev.target.closest("[data-go],[data-act]"); if (!el) return;
  if (el.dataset.act) {
    const fn = ACTIONS[el.dataset.act]; if (!fn) return;
    if (el.tagName === "A") return;
    ev.preventDefault(); Promise.resolve(fn(el, ev)).catch((e) => { console.error(e); toast(errMsg(e), "alert"); }); return;
  }
  ev.preventDefault();
  const r = el.dataset.go;
  if (r === "checkin") UI.ci = null;
  if (r === "med-edit") UI.medForm = null;
  if (r === "profile-edit") UI.pf = null;
  if (r === "measure") UI.meas = null;
  if (r === "routine") UI.rt = null;
  document.body.classList.remove("bar-hidden");
  if (!App.user && r === "platform") { UI.stack.push(UI.route); UI.route = { name: "platform", params: {} }; render({ scrollTop: true }); return; }
  if (["login", "signup", "forgot"].includes(r)) UI.auth.err = "";
  go(r, { id: el.dataset.id });
  if (r === "settings" && el.dataset.v) setTimeout(() => document.getElementById(el.dataset.v)?.scrollIntoView({ block: "start" }), 50);
});
document.addEventListener("input", (ev) => {
  const el = ev.target; const b = el.dataset?.bind; if (!b) return;
  const parts = b.split(".");
  if (parts.length >= 3 && /^\d+$/.test(parts.at(-1))) { getPath(UI, parts.slice(0, -1).join("."))[Number(parts.at(-1))] = el.value; }
  else setPath(UI, b, el.value);
  if (el.dataset.live === "results") { const r = $("#results"); if (r) { r.innerHTML = resultsHtml(); } }
  if (el.dataset.live === "docs") { clearTimeout(el._t); el._t = setTimeout(() => { const pos = el.selectionStart; render(); const n = $("#doc-q"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 200); }
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.dataset?.bind) { setPath(UI, el.dataset.bind, el.value); if (el.dataset.rerender) render(); if (el.closest(".sheet") && el.dataset.bind.startsWith("disc.filters")) { /* keep sheet open */ } }
  const ac = el.dataset?.actChange;
  if (ac === "pref-time") { DB.profiles[App.user.id].prefs[el.dataset.k] = el.value; saveDB(); toast(t("saved")); }
  if (ac === "doc-recat") { const d = DB.documents.find((x) => x.id === el.dataset.id); d.cat = el.value; saveDB(); toast(t("saved")); render(); }
  if (el.id === "doc-file" && el.files?.[0]) handleUpload(el.files[0]);
});
document.addEventListener("submit", (ev) => {
  const f = ev.target.closest("[data-form]"); if (!f) return; ev.preventDefault();
  const fn = FORMS[f.dataset.form]; if (fn) Promise.resolve(fn(f)).catch((e) => { console.error(e); toast(errMsg(e), "alert"); });
});
let lastScrollY = 0;
window.addEventListener("scroll", () => {
  const y = scrollY; const tb = document.getElementById("topbar"); if (tb) tb.classList.toggle("scrolled", y > 8);
  if (y > lastScrollY + 8 && y > 140) document.body.classList.add("bar-hidden");
  else if (y < lastScrollY - 8 || y < 140) document.body.classList.remove("bar-hidden");
  if (Math.abs(y - lastScrollY) > 8) lastScrollY = y;
}, { passive: true });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && UI.sheet) closeSheet(); });
["dragover", "dragleave", "drop"].forEach((type) => document.addEventListener(type, (ev) => {
  const dz = ev.target.closest?.("#dropzone"); if (!dz) return; ev.preventDefault();
  dz.classList.toggle("over", type === "dragover");
  if (type === "drop" && ev.dataTransfer.files[0]) handleUpload(ev.dataTransfer.files[0]);
}));
function handleUpload(file) {
  if (!/^image\/|application\/pdf/.test(file.type)) { toast(t("err_file_type"), "alert"); return; }
  if (file.size > 1.5 * 1024 * 1024) { toast(t("err_file_size"), "alert"); return; }
  const r = new FileReader();
  r.onload = () => {
    const cat = file.type.startsWith("image") ? "image" : /lab|result/i.test(file.name) ? "lab" : /presc/i.test(file.name) ? "prescription" : "other";
    DB.documents.push({ id: uid("doc"), patientId: PID(), name: file.name, cat, size: file.size, type: file.type, at: new Date().toISOString(), dataUrl: r.result, source: "patient" });
    DB.timeline.push({ id: uid("tl"), patientId: PID(), at: new Date().toISOString(), type: "document", msg: { k: "tl_doc", p: { name: file.name } }, source: "patient" });
    audit("au_doc_upload", PID());
    saveDB(); toast(t("uploaded")); render();
  };
  r.readAsDataURL(file);
}

/* ---------- boot ---------- */
async function boot() {
  applyTheme();
  const saved = safeStore.get("wellpoint.lang") || (navigator.language || "en").slice(0, 2);
  setLang(["en", "ar", "zh"].includes(saved) ? saved : "en");
  DB = loadDB();
  if (!DB || DB.version !== 3) { await seedDB(); saveDB(); }
  if (api.auth.restore()) { const p = DB.profiles[App.user.id]; if (p?.lang) setLang(p.lang); UI.route = { name: "home", params: {} }; }
  render();
  setInterval(reminderTick, 20000); setTimeout(reminderTick, 1500);
  if (window.claude?.use) {
    claude.use("sample").then((s) => { UI.aiLive = !!s; if (UI.route.name === "ai") render(); }).catch(() => { UI.aiLive = false; });
  } else UI.aiLive = false;
}
boot();

</script>
